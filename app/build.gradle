/*
 * This file was generated by the Gradle 'init' task.
 * Modified to build BadBM as an executable fat JAR.
 */

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Charting api/runtime
    implementation group: 'org.jfree', name: 'jfreechart', version: '1.0.17'
    // persistence API
    implementation group: 'jakarta.persistence', name: 'jakarta.persistence-api', version: '3.1.0'
    implementation group: 'org.eclipse.persistence', name: 'eclipselink', version: '4.0.2'
    // DBMS
    implementation group: 'org.apache.derby', name: 'derby', version: '10.15.2.0'
    implementation group: 'org.apache.derby', name: 'derbyshared', version: '10.15.2.0'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'edu.touro.mco152.bm.App'
}

// Note: sourceSets block for persistence.xml was removed due to
// Gradle 9 incompatibility - output.dir() syntax not supported


jar {
    // Story #3: Produce a single executable fat JAR with all dependencies bundled
    archiveFileName = 'badbm.jar'
    manifest {
        attributes 'Main-Class': 'edu.touro.mco152.bm.App'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}